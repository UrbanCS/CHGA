[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/news/:slug"
  to = "/.netlify/functions/news-detail?slug=:slug"
  status = 200

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200

[[redirects]]
  from = "/api/live"
  to = "/.netlify/functions/live"
  status = 200

[[redirects]]
  from = "/api/podcasts"
  to = "/.netlify/functions/podcasts"
  status = 200

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200

[[redirects]]
  from = "/api/push-webhook"
  to = "/.netlify/functions/push-webhook"
  status = 200

[[redirects]]
  from = "/api/check-news-push"
  to = "/.netlify/functions/check-news-push"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
